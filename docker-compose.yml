services:
  postgres:
    image: postgres:17
    container_name: cordell-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cordell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cordell_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-cordell_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cordell_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  cordell_postgres_data:
