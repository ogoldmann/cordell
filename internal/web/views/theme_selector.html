{{define "theme_selector"}}
  <div class="grid gap-2">
    {{range .Options}}
      <button
        class="flex w-full items-center gap-3 rounded-xl border border-cordell-border bg-cordell-surface-raised px-3 py-2 text-left text-sm font-bold text-cordell-text transition hover:border-cordell-primary hover:bg-cordell-primary-soft data-[selected=true]:border-cordell-primary data-[selected=true]:bg-cordell-primary-soft dark:border-cordell-border"
        type="button"
        data-theme-option="{{.Value}}"
        data-selected="false"
        aria-pressed="false"
      >
        <span class="inline-flex size-8 items-center justify-center rounded-lg bg-cordell-surface-muted text-cordell-muted">
          {{template "icon" .Icon}}
        </span>

        <span class="min-w-0">
          <span class="block text-cordell-text">{{.Label}}</span>
          <span class="block text-xs font-semibold text-cordell-muted">{{.Description}}</span>
        </span>
      </button>
    {{end}}
  </div>
{{end}}
