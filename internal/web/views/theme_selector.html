{{define "theme_selector"}}
  <div class="{{if .Compact}}cordell-theme-selector cordell-theme-selector-compact{{else}}cordell-theme-selector{{end}}">
    {{range .Options}}
      <button
        class="cordell-theme-option"
        type="button"
        data-theme-option="{{.Value}}"
        data-selected="false"
        aria-pressed="false"
      >
        <span class="cordell-theme-option-icon">
          {{template "icon" .Icon}}
        </span>

        <span class="cordell-theme-option-text">
          <span class="cordell-theme-option-label">{{.Label}}</span>

          {{if not $.Compact}}
            <span class="cordell-theme-option-description">{{.Description}}</span>
          {{end}}
        </span>
      </button>
    {{end}}
  </div>
{{end}}
