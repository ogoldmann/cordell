{{define "personnel_card"}}
<a
  class="flex flex-col gap-4 rounded-2xl border border-cordell-border bg-cordell-surface p-4 no-underline shadow-lg shadow-slate-900/5 transition hover:border-cordell-primary/50 sm:flex-row sm:items-center sm:justify-between dark:border-cordell-dark-border dark:bg-cordell-dark-surface dark:hover:border-cordell-dark-primary/60"
  href="/personnel/{{.ID}}"
>
  <div>
    <strong class="block text-lg">{{.Alias}}</strong>
    <span class="mt-1 block text-sm text-cordell-muted dark:text-cordell-dark-muted">
      {{.FullName}} · {{.RankLabel}} · {{.SectionLabel}}
    </span>
    <span class="mt-1 block font-mono text-xs text-cordell-muted dark:text-cordell-dark-muted">
      {{.ID}}
    </span>
  </div>

  <span class="inline-flex w-fit rounded-full px-3 py-1 text-xs font-bold {{if .Active}}bg-emerald-50 text-emerald-700 dark:bg-emerald-950/40 dark:text-emerald-200{{else}}bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300{{end}}">
    {{.StatusLabel}}
  </span>
</a>
{{end}}

  href="/assets/{{.ID}}"
>
  <div>
    <strong class="block text-lg">{{.Name}}</strong>
    <span class="mt-1 block font-mono text-xs text-cordell-muted dark:text-cordell-dark-muted">
      {{.ID}}
    </span>
  </div>

  <span class="inline-flex w-fit rounded-full px-3 py-1 text-xs font-bold {{if .Active}}bg-emerald-50 text-emerald-700 dark:bg-emerald-950/40 dark:text-emerald-200{{else}}bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300{{end}}">
    {{.StatusLabel}}
  </span>
</a>
{{end}}
