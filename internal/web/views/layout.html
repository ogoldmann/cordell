{{define "layout_start"}}
<!doctype html>
<html lang="pt-BR" data-theme="light" class="min-h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · Cordell</title>

  <script>
    (() => {
      const storageKey = 'cordell-theme'
      const allowedThemes = ['light', 'dark', 'sepia']
      const storedTheme = window.localStorage.getItem(storageKey)
      const theme = allowedThemes.includes(storedTheme) ? storedTheme : 'dark'

      document.documentElement.dataset.theme = theme
      document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light'
    })()
  </script>

  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="min-h-screen bg-cordell-background font-sans text-cordell-text antialiased dark:bg-cordell-dark-background dark:text-cordell-dark-text">
  {{template "navbar" .Navbar}}

  <main class="mx-auto max-w-5xl px-4 py-10">
    {{template "breadcrumbs" .}}
{{end}}

{{define "layout_end"}}
  </main>
  <script src="/static/js/theme.js" defer></script>
  <script src="/static/js/confirm-modal.js" defer></script>
  <script src="/static/js/submit-confirm-modal.js" defer></script>
  <script src="/static/js/custody-line-items.js" defer></script>
  <script src="/static/js/ledger-period-selector.js" defer></script>
  <script src="/static/js/live-search.js" defer></script>
  <script src="/static/js/navbar-search.js" defer></script>
  <script src="/static/js/operator-menu.js" defer></script>
</body>
</html>
{{end}}
