{{define "layout_start"}}
<!doctype html>
<html lang="en" data-theme="light" class="min-h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · Cordell</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="min-h-screen bg-cordell-background font-sans text-cordell-text antialiased dark:bg-cordell-dark-background dark:text-cordell-dark-text">
  <header class="border-b border-cordell-border/80 bg-white/80 backdrop-blur dark:border-cordell-dark-border dark:bg-cordell-dark-surface/80">
    <div class="mx-auto flex h-16 max-w-5xl items-center justify-between gap-6 px-4">
      <a class="text-lg font-extrabold tracking-[-0.03em] text-cordell-text no-underline dark:text-cordell-dark-text" href="/">
        Cordell
      </a>

      <nav class="flex flex-wrap items-center justify-end gap-x-4 gap-y-2 text-sm font-medium text-cordell-muted dark:text-cordell-dark-muted">
        <a class="hover:text-cordell-primary dark:hover:text-cordell-dark-primary" href="/">Dashboard</a>
        <a class="hover:text-cordell-primary dark:hover:text-cordell-dark-primary" href="/personnel">Personnel</a>
        <a class="hover:text-cordell-primary dark:hover:text-cordell-dark-primary" href="/assets">Assets</a>
        <a class="hover:text-cordell-primary dark:hover:text-cordell-dark-primary" href="/custody/checkouts/new">Checkout</a>
        <a class="hover:text-cordell-primary dark:hover:text-cordell-dark-primary" href="/custody/returns/new">Return</a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-4 py-10">
{{end}}

{{define "layout_end"}}
  </main>
</body>
</html>
{{end}}
