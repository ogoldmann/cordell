{{define "pagination"}}
  <nav class="flex flex-col gap-3 rounded-3xl border border-cordell-border bg-cordell-surface p-5 shadow-xl shadow-slate-900/5 dark:border-cordell-dark-border dark:bg-cordell-dark-surface sm:flex-row sm:items-center sm:justify-between" aria-label="Ledger pagination">
    <div>
      <p class="m-0 text-sm font-bold">
        Página {{.Page}}
      </p>

      <p class="mt-1 text-sm text-cordell-muted dark:text-cordell-dark-muted">
        Exibindo até {{.PageSize}} transações por página.
      </p>
    </div>

    <div class="flex flex-wrap gap-3">
      {{if .HasPreviousPage}}
        <a
          class="inline-flex items-center justify-center rounded-xl border border-cordell-border bg-white px-5 py-3 font-bold text-cordell-text no-underline transition hover:border-cordell-primary/50 dark:border-cordell-dark-border dark:bg-cordell-dark-background dark:text-cordell-dark-text dark:hover:border-cordell-dark-primary/60"
          href="{{.PreviousPageURL}}"
        >
          Anterior
        </a>
      {{else}}
        <span
          class="inline-flex cursor-not-allowed items-center justify-center rounded-xl border border-cordell-border bg-cordell-background px-5 py-3 font-bold text-cordell-muted opacity-60 dark:border-cordell-dark-border dark:bg-cordell-dark-background dark:text-cordell-dark-muted"
        >
          Anterior
        </span>
      {{end}}

      {{if .HasNextPage}}
        <a
          class="inline-flex items-center justify-center rounded-xl bg-cordell-primary px-5 py-3 font-bold text-white no-underline transition hover:bg-cordell-primary-hover dark:bg-cordell-dark-primary dark:text-cordell-dark-background"
          href="{{.NextPageURL}}"
        >
          Próxima
        </a>
      {{else}}
        <span
          class="inline-flex cursor-not-allowed items-center justify-center rounded-xl bg-cordell-primary px-5 py-3 font-bold text-white opacity-50 dark:bg-cordell-dark-primary dark:text-cordell-dark-background"
        >
          Próxima
        </span>
      {{end}}
    </div>
  </nav>
{{end}}
