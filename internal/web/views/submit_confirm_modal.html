{{define "submit_confirm_modal"}}
<dialog
  class="fixed inset-0 m-auto w-[min(92vw,42rem)] rounded-3xl border border-cordell-border bg-cordell-surface p-0 text-cordell-text shadow-2xl backdrop:bg-slate-950/50 dark:border-cordell-dark-border dark:bg-cordell-dark-surface dark:text-cordell-dark-text"
  data-submit-confirm-modal
  aria-labelledby="submit-confirm-modal-title"
>
  <div class="p-6">
    <p class="mb-2 text-xs font-extrabold uppercase tracking-[0.08em] text-cordell-primary dark:text-cordell-dark-primary">
      Confirm edit
    </p>

    <h2
      class="m-0 text-2xl font-extrabold leading-tight tracking-[-0.04em]"
      id="submit-confirm-modal-title"
      data-submit-confirm-title
    >
      Save edit?
    </h2>

    <p
      class="mt-3 text-cordell-muted dark:text-cordell-dark-muted"
      data-submit-confirm-description
    ></p>

    <div
      class="mt-5 rounded-2xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm font-bold text-amber-800 dark:border-amber-900/60 dark:bg-amber-950/40 dark:text-amber-200"
      data-submit-confirm-warning
      hidden
    ></div>

    <div class="mt-6 flex flex-col gap-3 sm:flex-row">
      <button
        class="inline-flex w-full items-center justify-center rounded-xl border border-amber-300 bg-amber-50 px-5 py-3 font-bold text-amber-800 transition hover:border-amber-400 sm:w-auto dark:border-amber-900/60 dark:bg-amber-950/40 dark:text-amber-200"
        type="button"
        data-submit-confirm-confirm-button
      >
        Save edit
      </button>

      <form method="dialog">
        <button
          class="inline-flex w-full items-center justify-center rounded-xl border border-cordell-border bg-white px-5 py-3 font-bold text-cordell-text transition hover:border-cordell-primary/50 sm:w-auto dark:border-cordell-dark-border dark:bg-cordell-dark-background dark:text-cordell-dark-text dark:hover:border-cordell-dark-primary/60"
          type="submit"
        >
          Cancel
        </button>
      </form>
    </div>
  </div>
</dialog>
{{end}}
