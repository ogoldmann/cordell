{{define "login.html"}}
<!doctype html>
<html lang="pt-BR" data-theme="light" class="min-h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · Cordell</title>

  <script>
    (() => {
      const storageKey = 'cordell-theme'
      const allowedThemes = ['light', 'dark', 'sepia']
      const storedTheme = window.localStorage.getItem(storageKey)
      const theme = allowedThemes.includes(storedTheme) ? storedTheme : 'dark'

      document.documentElement.dataset.theme = theme
      document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light'
    })()
  </script>

  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="min-h-screen bg-cordell-background font-sans text-cordell-text antialiased dark:bg-cordell-dark-background dark:text-cordell-dark-text">
  <main class="cordell-login-page">
    <div class="cordell-login-particles" aria-hidden="true">
      <span class="cordell-login-particle cordell-login-particle-sm" style="left: 4%; animation-duration: 18s; animation-delay: -4s;"></span>
      <span class="cordell-login-particle cordell-login-particle-md" style="left: 9%; animation-duration: 26s; animation-delay: -14s;"></span>
      <span class="cordell-login-particle cordell-login-particle-xs" style="left: 14%; animation-duration: 21s; animation-delay: -7s;"></span>
      <span class="cordell-login-particle cordell-login-particle-lg" style="left: 19%; animation-duration: 31s; animation-delay: -20s;"></span>
      <span class="cordell-login-particle cordell-login-particle-sm" style="left: 25%; animation-duration: 23s; animation-delay: -9s;"></span>
      <span class="cordell-login-particle cordell-login-particle-md" style="left: 31%; animation-duration: 28s; animation-delay: -17s;"></span>
      <span class="cordell-login-particle cordell-login-particle-xs" style="left: 37%; animation-duration: 19s; animation-delay: -5s;"></span>
      <span class="cordell-login-particle cordell-login-particle-lg" style="left: 43%; animation-duration: 34s; animation-delay: -23s;"></span>
      <span class="cordell-login-particle cordell-login-particle-sm" style="left: 49%; animation-duration: 22s; animation-delay: -11s;"></span>
      <span class="cordell-login-particle cordell-login-particle-md" style="left: 55%; animation-duration: 27s; animation-delay: -16s;"></span>
      <span class="cordell-login-particle cordell-login-particle-xs" style="left: 61%; animation-duration: 20s; animation-delay: -8s;"></span>
      <span class="cordell-login-particle cordell-login-particle-lg" style="left: 67%; animation-duration: 32s; animation-delay: -25s;"></span>
      <span class="cordell-login-particle cordell-login-particle-sm" style="left: 73%; animation-duration: 24s; animation-delay: -12s;"></span>
      <span class="cordell-login-particle cordell-login-particle-md" style="left: 79%; animation-duration: 29s; animation-delay: -19s;"></span>
      <span class="cordell-login-particle cordell-login-particle-xs" style="left: 85%; animation-duration: 18s; animation-delay: -6s;"></span>
      <span class="cordell-login-particle cordell-login-particle-lg" style="left: 91%; animation-duration: 35s; animation-delay: -28s;"></span>
      <span class="cordell-login-particle cordell-login-particle-sm" style="left: 96%; animation-duration: 21s; animation-delay: -10s;"></span>
    </div>

    <div class="cordell-login-shell">
      <header class="cordell-login-topbar">
        <div class="cordell-login-brand" aria-label="Cordell">
          <span class="cordell-login-brand-name">cordell</span>
          <span class="cordell-login-brand-section">PELOTÃO DE SEGURANÇA</span>
        </div>

        <div class="cordell-login-theme-menu" data-login-theme-menu>
          <button
            class="cordell-login-theme-button"
            type="button"
            data-login-theme-menu-button
            aria-label="Selecionar tema"
            aria-expanded="false"
            aria-haspopup="true"
          >
            {{template "icon" (newIcon "moon" "size-4")}}
          </button>

          <div class="cordell-login-theme-dropdown" data-login-theme-menu-dropdown hidden>
            {{template "theme_selector" .ThemeSelector}}
          </div>
        </div>
      </header>

      <section class="cordell-login-main" aria-labelledby="login-title">
        <div class="cordell-login-card">
          <div class="cordell-login-card-inner">
            <h1 id="login-title" class="cordell-login-heading">login</h1>

            <p class="cordell-login-subtitle">
              faça login na sua conta para continuar
            </p>

            <form class="cordell-login-form" method="post" action="/login">
              {{if .ReturnTo}}
                <input type="hidden" name="return_to" value="{{.ReturnTo}}">
              {{end}}

              {{if .Error}}
                <p class="cordell-login-error">
                  {{.Error}}
                </p>
              {{end}}

              <label class="cordell-login-field">
                <span class="cordell-login-label">Identidade</span>
                <input
                  class="cordell-login-input"
                  type="text"
                  name="registration_id"
                  value="{{.RegistrationID}}"
                  autocomplete="username"
                  inputmode="text"
                  autofocus
                  required
                >
              </label>

              <label class="cordell-login-field">
                <span class="cordell-login-label">Senha</span>
                <input
                  class="cordell-login-input"
                  type="password"
                  name="password"
                  autocomplete="current-password"
                  required
                >
              </label>

              <button class="cordell-login-submit" type="submit">
                Entrar
              </button>
            </form>
          </div>
        </div>
      </section>

      <footer class="cordell-login-footer">
        desenvolvido por sd galliac
      </footer>
    </div>
  </main>

  <script src="/static/js/theme.js" defer></script>
  <script src="/static/js/login-theme-menu.js" defer></script>
</body>
</html>
{{end}}
