{{define "checkout_new.html"}}
{{template "layout_start" .}}

<section class="mb-6">
  <p class="mb-2 text-xs font-extrabold uppercase tracking-[0.08em] text-cordell-primary dark:text-cordell-dark-primary">
    Custody
  </p>

  <h1 class="m-0 text-4xl font-extrabold leading-tight tracking-[-0.04em]">
    Register checkout
  </h1>

  <p class="mt-3 text-cordell-muted dark:text-cordell-dark-muted">
    Assign an asset quantity to personnel under custody.
  </p>
</section>

{{if .Error}}
  <div class="mb-4 rounded-2xl border border-cordell-danger-border bg-cordell-danger-surface px-4 py-3 font-medium text-cordell-danger-text">
    {{.Error}}
  </div>
{{end}}

<form
  class="rounded-3xl border border-cordell-border bg-cordell-surface p-6 shadow-xl shadow-slate-900/5 dark:border-cordell-dark-border dark:bg-cordell-dark-surface"
  method="post"
  action="/custody/checkouts"
>
  <div class="grid gap-4 lg:grid-cols-[1fr_1fr_10rem]">
    <div class="grid gap-2">
      <label class="text-sm font-bold" for="personnel_id">Personnel</label>
      <select
        class="w-full rounded-xl border border-cordell-border bg-white px-4 py-3 font-sans text-cordell-text outline-none transition focus:border-cordell-primary focus:ring-4 focus:ring-cordell-primary/15 dark:border-cordell-dark-border dark:bg-cordell-dark-background dark:text-cordell-dark-text dark:focus:border-cordell-dark-primary dark:focus:ring-cordell-dark-primary/15"
        id="personnel_id"
        name="personnel_id"
        required
      >
        <option value="">Select personnel</option>
        {{range .Personnel}}
          <option value="{{.ID}}" {{if eq $.SelectedPersonnelID .ID}}selected{{end}}>
            {{.Alias}} — {{.FullName}}
          </option>
        {{end}}
      </select>
    </div>

    <div class="grid gap-2">
      <label class="text-sm font-bold" for="asset_id">Asset</label>
      <select
        class="w-full rounded-xl border border-cordell-border bg-white px-4 py-3 font-sans text-cordell-text outline-none transition focus:border-cordell-primary focus:ring-4 focus:ring-cordell-primary/15 dark:border-cordell-dark-border dark:bg-cordell-dark-background dark:text-cordell-dark-text dark:focus:border-cordell-dark-primary dark:focus:ring-cordell-dark-primary/15"
        id="asset_id"
        name="asset_id"
        required
      >
        <option value="">Select asset</option>
        {{range .Assets}}
          <option value="{{.ID}}" {{if eq $.SelectedAssetID .ID}}selected{{end}}>
            {{.Name}}
          </option>
        {{end}}
      </select>
    </div>

    <div class="grid gap-2">
      <label class="text-sm font-bold" for="quantity">Quantity</label>
      <input
        class="w-full rounded-xl border border-cordell-border bg-white px-4 py-3 font-sans text-cordell-text outline-none transition placeholder:text-cordell-muted/70 focus:border-cordell-primary focus:ring-4 focus:ring-cordell-primary/15 dark:border-cordell-dark-border dark:bg-cordell-dark-background dark:text-cordell-dark-text dark:placeholder:text-cordell-dark-muted/70 dark:focus:border-cordell-dark-primary dark:focus:ring-cordell-dark-primary/15"
        id="quantity"
        name="quantity"
        type="number"
        min="1"
        step="1"
        value="{{.Quantity}}"
        required
      >
    </div>
  </div>

  <div class="mt-4 grid gap-2">
    <label class="text-sm font-bold" for="notes">Notes</label>
    <textarea
      class="min-h-28 w-full resize-y rounded-xl border border-cordell-border bg-white px-4 py-3 font-sans text-cordell-text outline-none transition placeholder:text-cordell-muted/70 focus:border-cordell-primary focus:ring-4 focus:ring-cordell-primary/15 dark:border-cordell-dark-border dark:bg-cordell-dark-background dark:text-cordell-dark-text dark:placeholder:text-cordell-dark-muted/70 dark:focus:border-cordell-dark-primary dark:focus:ring-cordell-dark-primary/15"
      id="notes"
      name="notes"
      rows="4"
    >{{.Notes}}</textarea>
  </div>

  <div class="mt-6 flex flex-col gap-3 sm:flex-row">
    <button
      class="inline-flex cursor-pointer items-center justify-center rounded-xl border-0 bg-cordell-primary px-4 py-3 font-bold text-white transition hover:bg-cordell-primary-hover dark:bg-cordell-dark-primary dark:text-cordell-dark-background"
      type="submit"
    >
      Register checkout
    </button>

    <a
      class="inline-flex items-center justify-center rounded-xl border border-cordell-border bg-white px-4 py-3 font-bold text-cordell-text no-underline transition hover:border-cordell-primary/50 dark:border-cordell-dark-border dark:bg-cordell-dark-background dark:text-cordell-dark-text dark:hover:border-cordell-dark-primary/60"
      href="/personnel"
    >
      Cancel
    </a>
  </div>
</form>

{{template "layout_end" .}}
{{end}}
