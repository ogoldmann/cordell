{{define "assets_index.html"}}
{{template "layout_start" .}}

{{template "page_header" .Header}}

<nav class="mb-6 flex flex-wrap gap-2" aria-label="Filtro de status de materiais">
  {{range .StatusTabs}}
    <a
      class="inline-flex items-center justify-center rounded-full border px-4 py-2 text-sm font-bold no-underline transition {{if .Active}}border-cordell-primary bg-cordell-primary text-white dark:border-cordell-dark-primary dark:bg-cordell-dark-primary dark:text-cordell-dark-background{{else}}border-cordell-border bg-cordell-surface text-cordell-text hover:border-cordell-primary/50 dark:border-cordell-dark-border dark:bg-cordell-dark-surface dark:text-cordell-dark-text dark:hover:border-cordell-dark-primary/60{{end}}"
      href="{{.URL}}"
    >
      {{.Label}}
    </a>
  {{end}}
</nav>

<form
  class="mb-6 rounded-3xl border border-cordell-border bg-cordell-surface p-5 shadow-xl shadow-slate-900/5 dark:border-cordell-dark-border dark:bg-cordell-dark-surface"
  method="get"
  action="/assets"
  data-live-search-form
  data-live-search-target="#asset-results"
  data-live-search-status="#asset-search-status"
  data-live-search-delay="250"
>
  <input type="hidden" name="status" value="{{.StatusFilter}}">

  <div class="flex flex-col gap-3 sm:flex-row sm:items-end">
    <label class="flex-1">
      <span class="text-sm font-bold text-cordell-muted dark:text-cordell-dark-muted">Pesquisa</span>
      <input
        class="mt-2 w-full rounded-xl border border-cordell-border bg-white px-4 py-3 font-sans text-cordell-text outline-none transition placeholder:text-cordell-muted/70 focus:border-cordell-primary focus:ring-4 focus:ring-cordell-primary/15 dark:border-cordell-dark-border dark:bg-cordell-dark-background dark:text-cordell-dark-text dark:placeholder:text-cordell-dark-muted/70 dark:focus:border-cordell-dark-primary dark:focus:ring-cordell-dark-primary/15"
        type="search"
        name="q"
        value="{{.SearchQuery}}"
        placeholder="Nome do material..."
        autocomplete="off"
      >
    </label>

    <button
      class="inline-flex items-center justify-center rounded-xl bg-cordell-primary px-5 py-3 font-bold text-white transition hover:bg-cordell-primary-hover dark:bg-cordell-dark-primary dark:text-cordell-dark-background"
      type="submit"
    >
      Pesquisar
    </button>
  </div>
</form>

<p
  id="asset-search-status"
  class="sr-only"
  aria-live="polite"
></p>

<div id="asset-results">
  {{template "asset_list" .}}
</div>

{{template "layout_end" .}}
{{end}}
