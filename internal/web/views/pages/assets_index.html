{{define "assets_index.html"}}
{{template "layout_start" .}}

{{template "page_header" .Header}}

<nav class="mb-6 flex flex-wrap gap-2" aria-label="Filtro de status de materiais">
  {{range .StatusTabs}}
    <a
      class="inline-flex items-center justify-center rounded-full border px-4 py-2 text-sm font-bold no-underline transition {{if .Active}}border-cordell-primary bg-cordell-primary text-white dark:border-cordell-dark-primary dark:bg-cordell-dark-primary dark:text-cordell-dark-background{{else}}border-cordell-border bg-cordell-surface text-cordell-text hover:border-cordell-primary/50 dark:border-cordell-dark-border dark:bg-cordell-dark-surface dark:text-cordell-dark-text dark:hover:border-cordell-dark-primary/60{{end}}"
      href="{{.URL}}"
    >
      {{.Label}}
    </a>
  {{end}}
</nav>

{{if .Assets}}
  <div class="grid gap-3">
    {{range .Assets}}
      {{template "asset_card" .}}
    {{end}}
  </div>
{{else}}
  {{template "empty_state" .EmptyState}}
{{end}}

{{template "layout_end" .}}
{{end}}
