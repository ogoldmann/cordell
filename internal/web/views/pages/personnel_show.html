{{define "personnel_show.html"}}
{{template "layout_start" .}}

<section class="page-header">
  <p class="eyebrow">Personnel</p>
  <h1>{{.Personnel.FullName}}</h1>
  <p class="muted">Personnel record created successfully.</p>
</section>

<div class="card details">
  <dl>
    <div>
      <dt>ID</dt>
      <dd>{{.Personnel.ID}}</dd>
    </div>

    <div>
      <dt>Full name</dt>
      <dd>{{.Personnel.FullName}}</dd>
    </div>

    <div>
      <dt>Active</dt>
      <dd>{{.Personnel.Active}}</dd>
    </div>
  </dl>
</div>

<div class="actions">
  <a class="button-secondary" href="/personnel/new">Create another personnel</a>
</div>

{{template "layout_end" .}}
{{end}}
