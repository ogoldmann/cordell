{{define "personnel_new.html"}}
{{template "layout_start" .}}

{{template "page_header" .Header}}

{{if .Error}}
  <div class="mb-4 rounded-2xl border border-cordell-danger-border bg-cordell-danger-surface px-4 py-3 font-medium text-cordell-danger-text">
    {{.Error}}
  </div>
{{end}}

<form
  class="rounded-3xl border border-cordell-border bg-cordell-surface p-6 shadow-xl shadow-slate-900/5 dark:border-cordell-dark-border dark:bg-cordell-dark-surface"
  method="post"
  action="/personnel"
>
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

  <section class="border-b border-cordell-border pb-6 dark:border-cordell-dark-border">
    <div class="mb-4">
      <p class="mb-1 text-xs font-extrabold uppercase tracking-[0.08em] text-cordell-primary dark:text-cordell-dark-primary">
        Identificação
      </p>

      <h2 class="m-0 text-2xl font-extrabold tracking-[-0.03em]">
        Identificação do militar
      </h2>
    </div>

    <div class="grid gap-4 md:grid-cols-3">
      <div class="grid gap-2 md:col-span-2">
        <label class="text-sm font-bold" for="full_name">Nome completo</label>
        <input
          class="w-full rounded-xl border border-cordell-border bg-white px-4 py-3 font-sans text-cordell-text outline-none transition placeholder:text-cordell-muted/70 focus:border-cordell-primary focus:ring-4 focus:ring-cordell-primary/15 dark:border-cordell-dark-border dark:bg-cordell-dark-background dark:text-cordell-dark-text dark:placeholder:text-cordell-dark-muted/70 dark:focus:border-cordell-dark-primary dark:focus:ring-cordell-dark-primary/15"
          id="full_name"
          name="full_name"
          type="text"
          value="{{.FullName}}"
          autocomplete="off"
          required
        >
      </div>

      <div class="grid gap-2">
        <label class="text-sm font-bold" for="alias">Nome de guerra</label>
        <input
          class="w-full rounded-xl border border-cordell-border bg-white px-4 py-3 font-sans text-cordell-text outline-none transition placeholder:text-cordell-muted/70 focus:border-cordell-primary focus:ring-4 focus:ring-cordell-primary/15 dark:border-cordell-dark-border dark:bg-cordell-dark-background dark:text-cordell-dark-text dark:placeholder:text-cordell-dark-muted/70 dark:focus:border-cordell-dark-primary dark:focus:ring-cordell-dark-primary/15"
          id="alias"
          name="alias"
          type="text"
          value="{{.Alias}}"
          autocomplete="off"
          required
        >
      </div>

      <div class="grid gap-2">
        <label class="text-sm font-bold" for="registration_id">Identidade</label>
        <input
          class="w-full rounded-xl border border-cordell-border bg-white px-4 py-3 font-sans text-cordell-text outline-none transition placeholder:text-cordell-muted/70 focus:border-cordell-primary focus:ring-4 focus:ring-cordell-primary/15 dark:border-cordell-dark-border dark:bg-cordell-dark-background dark:text-cordell-dark-text dark:placeholder:text-cordell-dark-muted/70 dark:focus:border-cordell-dark-primary dark:focus:ring-cordell-dark-primary/15"
          id="registration_id"
          name="registration_id"
          type="text"
          value="{{.RegistrationID}}"
          autocomplete="off"
          required
        >
      </div>
    </div>
  </section>

  <section class="pt-6">
    <div class="mb-4">
      <p class="mb-1 text-xs font-extrabold uppercase tracking-[0.08em] text-cordell-primary dark:text-cordell-dark-primary">
        Classificação
      </p>

      <h2 class="m-0 text-2xl font-extrabold tracking-[-0.03em]">
        Dados organizacionais
      </h2>
    </div>

    <div class="grid gap-4 md:grid-cols-3">
      <div class="grid gap-2">
        <label class="text-sm font-bold" for="rank">Posto/Graduação</label>
        <select
          class="w-full rounded-xl border border-cordell-border bg-white px-4 py-3 font-sans text-cordell-text outline-none transition focus:border-cordell-primary focus:ring-4 focus:ring-cordell-primary/15 dark:border-cordell-dark-border dark:bg-cordell-dark-background dark:text-cordell-dark-text dark:focus:border-cordell-dark-primary dark:focus:ring-cordell-dark-primary/15"
          id="rank"
          name="rank"
          required
        >
          <option value="">Selecione o posto/graduação</option>
          {{range .RankOptions}}
            <option value="{{.Value}}" {{if eq $.SelectedRank .Value}}selected{{end}}>
              {{.Label}}
            </option>
          {{end}}
        </select>
      </div>

      <div class="grid gap-2">
        <label class="text-sm font-bold" for="section">Seção</label>
        <select
          class="w-full rounded-xl border border-cordell-border bg-white px-4 py-3 font-sans text-cordell-text outline-none transition focus:border-cordell-primary focus:ring-4 focus:ring-cordell-primary/15 dark:border-cordell-dark-border dark:bg-cordell-dark-background dark:text-cordell-dark-text dark:focus:border-cordell-dark-primary dark:focus:ring-cordell-dark-primary/15"
          id="section"
          name="section"
          required
        >
          <option value="">Selecione a seção</option>
          {{range .SectionOptions}}
            <option value="{{.Value}}" {{if eq $.SelectedSection .Value}}selected{{end}}>
              {{.Label}}
            </option>
          {{end}}
        </select>
      </div>

      <div class="grid gap-2">
        <label class="text-sm font-bold" for="organization_unit">Organização</label>
        <select
          class="w-full rounded-xl border border-cordell-border bg-white px-4 py-3 font-sans text-cordell-text outline-none transition focus:border-cordell-primary focus:ring-4 focus:ring-cordell-primary/15 dark:border-cordell-dark-border dark:bg-cordell-dark-background dark:text-cordell-dark-text dark:focus:border-cordell-dark-primary dark:focus:ring-cordell-dark-primary/15"
          id="organization_unit"
          name="organization_unit"
          required
        >
          <option value="">Selecione a organização</option>
          {{range .OrganizationUnitOptions}}
            <option value="{{.Value}}" {{if eq $.SelectedOrganizationUnit .Value}}selected{{end}}>
              {{.Label}}
            </option>
          {{end}}
        </select>
      </div>
    </div>
  </section>

  {{template "form_actions" .FormActions}}
</form>

{{template "layout_end" .}}
{{end}}
