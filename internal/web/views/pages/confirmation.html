{{define "confirmation.html"}}
{{template "layout_start" .}}

<section class="mx-auto max-w-3xl">
  <p class="mb-2 text-xs font-extrabold uppercase tracking-[0.08em] text-cordell-primary dark:text-cordell-dark-primary">
    {{.Kicker}}
  </p>

  <div class="rounded-3xl border border-cordell-border bg-cordell-surface p-6 shadow-xl shadow-slate-900/5 dark:border-cordell-dark-border dark:bg-cordell-dark-surface">
    <h1 class="m-0 text-3xl font-extrabold leading-tight tracking-[-0.04em]">
      {{.Heading}}
    </h1>

    <p class="mt-3 text-cordell-muted dark:text-cordell-dark-muted">
      {{.Description}}
    </p>

    {{if .Warning}}
      <div class="mt-5 rounded-2xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm font-bold text-amber-800 dark:border-amber-900/60 dark:bg-amber-950/40 dark:text-amber-200">
        {{.Warning}}
      </div>
    {{end}}

    <div class="mt-6 flex flex-col gap-3 sm:flex-row">
      <form method="post" action="{{.ConfirmAction}}">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

        <button
          class="inline-flex w-full items-center justify-center rounded-xl px-5 py-3 font-bold transition sm:w-auto {{if eq .ConfirmationStyle "warning"}}border border-amber-300 bg-amber-50 text-amber-800 hover:border-amber-400 dark:border-amber-900/60 dark:bg-amber-950/40 dark:text-amber-200{{else}}bg-cordell-primary text-white hover:bg-cordell-primary-hover dark:bg-cordell-dark-primary dark:text-cordell-dark-background{{end}}"
          type="submit"
        >
          {{.ConfirmLabel}}
        </button>
      </form>

      <a
        class="inline-flex items-center justify-center rounded-xl border border-cordell-border bg-white px-5 py-3 font-bold text-cordell-text no-underline transition hover:border-cordell-primary/50 dark:border-cordell-dark-border dark:bg-cordell-dark-background dark:text-cordell-dark-text dark:hover:border-cordell-dark-primary/60"
        href="{{.CancelURL}}"
      >
        {{.CancelLabel}}
      </a>
    </div>
  </div>
</section>

{{template "layout_end" .}}
{{end}}
